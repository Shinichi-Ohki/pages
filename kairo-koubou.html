<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回路工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b110d; --panel:#101a14; --panel2:#14221a; --border:#22382b;
  --text:#d9e7dd; --muted:#8fa999; --dim:#5c7365;
  --pcb:#0f4d30; --gold:#d8b04a; --copper:#c47a3a; --silk:#eef3ee;
  --led:#ff3b30; --ok:#4ade80; --warn:#facc15; --bad:#ff5a4e; --cyan:#5ee7ff;
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --pix:'DotGothic16','Hiragino Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:21px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,#16271d 0,transparent 60%);overflow:hidden;display:flex;flex-direction:column;height:100vh}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--border);background:#0d1611}
.logo{font-family:var(--pix);font-size:33px;letter-spacing:.06em;line-height:1.1}
.logo small{display:block;font-size:15px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.logo b{color:var(--gold);font-weight:normal}
.counter{text-align:center}
.counter .big{font-family:var(--mono);font-size:52px;color:#ff6b5e;text-shadow:0 0 8px rgba(255,59,48,.7),0 0 20px rgba(255,59,48,.35);line-height:1;letter-spacing:.04em}
.counter .big .u{font-size:27px;opacity:.8;margin-left:8px}
.counter .rate{font-family:var(--mono);color:var(--muted);margin-top:4px;font-size:22px}
.power{min-width:320px}
.power .lbl{display:flex;justify-content:space-between;gap:12px;font-size:18px;color:var(--muted);font-family:var(--mono)}
.power .bar{height:14px;border:1px solid var(--border);border-radius:7px;background:#0a120d;overflow:hidden;margin-top:4px}
.power .fill{height:100%;width:0;background:var(--ok);transition:width .2s,background .2s}
.power .st{font-size:18px;margin-top:3px;font-family:var(--mono);color:var(--ok)}
.power.brown .st{color:var(--bad);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

.ticker{min-height:38px;overflow:hidden;border-bottom:1px solid var(--border);background:#0a100c;color:var(--muted);font-size:18px;display:flex;align-items:center;padding:0 18px;gap:12px}
.ticker .tag{font-family:var(--mono);color:var(--gold);flex:none}
.ticker .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.buffs{display:flex;gap:6px;margin-left:auto;flex:none}
.buff{font-family:var(--mono);font-size:16px;padding:1px 10px;border-radius:12px;background:#3a2b07;color:var(--warn);border:1px solid #6b5212}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(380px,1.05fr) minmax(400px,1fr) minmax(400px,1fr);gap:12px;padding:12px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border);font-family:var(--pix);font-size:23px;gap:8px}
.ph .hint{font-family:inherit;font-size:17px;color:var(--muted)}
.pb{overflow-y:auto;padding:12px;flex:1;min-height:0}
.pb::-webkit-scrollbar{width:10px}.pb::-webkit-scrollbar-thumb{background:#24392c;border-radius:5px}

/* board */
#boardWrap{position:relative;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px #1d5a3a, 0 6px 24px rgba(0,0,0,.45);transition:box-shadow .3s;max-width:680px;margin:0 auto}
#boardWrap.oc{box-shadow:inset 0 0 0 2px var(--warn),0 0 24px rgba(250,204,21,.35)}
#board{display:block;width:100%;cursor:crosshair;touch-action:manipulation;outline:none}
.float{position:absolute;pointer-events:none;font-family:var(--mono);font-size:26px;color:#fff6c2;text-shadow:0 0 6px #ffb300;animation:up .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-260%);opacity:0}}
.clickhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--pix);background:rgba(0,0,0,.6);padding:10px 18px;border-radius:8px;border:1px dashed var(--silk);color:var(--silk);text-align:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.junk{position:absolute;width:88px;height:64px;border:none;cursor:pointer;background:linear-gradient(#c79a5b,#a87a3e);border-radius:5px;box-shadow:0 0 0 2px #6b4a1f,0 0 22px 6px rgba(255,214,90,.75);animation:bob 1.1s ease-in-out infinite;padding:0}
.junk::before{content:"";position:absolute;left:0;right:0;top:16px;height:3px;background:#6b4a1f}
.junk span{font-family:var(--pix);font-size:18px;color:#3b2408;position:relative;top:8px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.clickinfo{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);color:var(--muted);font-size:18px;margin:10px auto 0;max-width:680px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px auto 0;max-width:680px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.stat .k{font-size:16px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:23px}

/* shop */
.amt{display:flex;gap:3px}
.amt button{background:#0b130e;border:1px solid var(--border);padding:3px 10px;font-family:var(--mono);font-size:18px;cursor:pointer;border-radius:5px}
.amt button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s}
.card:hover{border-color:#3d6a4f}
.card.can{border-color:#3b6b4c;background:#16281d}
.card.can .cost{color:var(--ok)}
.card.cant{opacity:.62}
.card.locked{opacity:.4;cursor:default}
.card .ico{width:64px;height:64px;border-radius:6px;background:var(--pcb);display:block}
.card .nm{font-weight:600}
.card .sub{font-family:var(--mono);font-size:16px;color:var(--muted);margin-left:8px}
.card .cd{font-size:16px;color:var(--muted);margin-top:2px;line-height:1.45}
.card .cf{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:4px;font-family:var(--mono);font-size:18px}
.card .cost{color:var(--bad)}
.card .rate{color:var(--muted)}
.card .count{font-family:var(--mono);font-size:38px;color:var(--gold);min-width:44px;text-align:right}
.badge{width:64px;height:64px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:15px;letter-spacing:.02em;border:1px solid}
.badge > div{text-align:center;line-height:1.15}
.badge small{display:block;font-size:17px;font-weight:bold}
.b-click{background:#2a1a0c;color:#ffb46b;border-color:#6b3f17}
.b-global{background:#0c1f2a;color:var(--cyan);border-color:#17526b}
.b-psu{background:#2a0c0c;color:#ff8a80;border-color:#6b1717}
.b-watt{background:#1f2a0c;color:#c7f36b;border-color:#4d6b17}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:10px 8px;cursor:pointer;color:var(--muted);font-family:var(--pix);font-size:21px;white-space:nowrap;position:relative}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.tabs .dot{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--ok);color:#06200f;font-family:var(--mono);font-size:16px;margin-left:4px}
.tab{display:none}.tab.on{display:block}
.sec{font-family:var(--pix);color:var(--muted);font-size:19px;margin:12px 2px 8px}
.empty{color:var(--dim);font-size:18px;padding:16px;text-align:center}

.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ac{border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:#0c140f;font-size:16px;color:var(--dim)}
.ac b{display:block;font-size:18px;font-weight:600}
.ac.got{border-color:#6b5a1f;background:#1e1a0b;color:#cdbb85}
.ac.got b{color:var(--gold)}

.pp{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;line-height:1.7}
.pp .n{font-family:var(--mono);font-size:33px;color:var(--gold)}
.btn{background:var(--gold);color:#1a1405;border:none;border-radius:6px;padding:10px 18px;font-family:var(--pix);cursor:pointer;font-size:20px}
.btn:disabled{background:#2a3a30;color:var(--dim);cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:#5a1612;color:#ffd6d2}
textarea{width:100%;height:120px;background:#0a110c;color:var(--text);border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:16px;padding:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:19px}
.kv span:nth-child(even){font-family:var(--mono);color:var(--gold);text-align:right}
#upOwned{margin-top:6px;border-top:1px solid var(--border);padding-top:4px}
#upOwned summary{cursor:pointer;list-style:revert}
.owned{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:6px 4px;border-bottom:1px dashed var(--border)}
.owned b{color:var(--gold);font-weight:600}
.owned span{font-size:16px;color:var(--muted)}
.note{font-size:18px}
.note-s{font-size:16px;color:var(--muted)}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none;max-width:min(480px,calc(100vw - 36px))}
.toast{background:#13241a;border:1px solid #2f5a41;border-left:5px solid var(--ok);padding:10px 14px;border-radius:6px;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.gold{border-left-color:var(--gold)}
.toast.ach{border-left-color:var(--cyan)}
.toast small{display:block;color:var(--muted);font-size:16px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}

/* 幅が足りないときは2列 → 1列。ページ全体をスクロール */
@media (max-width:1320px){
  body{overflow:auto;height:auto;display:block}
  main{grid-template-columns:1fr 1fr}
  main > .panel:first-child{grid-column:1 / -1}
  .pb{overflow:visible}
  header{grid-template-columns:1fr auto;}
  .counter{grid-column:1 / -1;grid-row:2}
}
@media (max-width:860px){
  main{grid-template-columns:1fr;padding:8px;gap:8px}
  header{grid-template-columns:1fr;text-align:center;padding:10px}
  .counter{grid-row:auto}
  .power{min-width:0}
  .counter .big{font-size:42px}
  .ticker{padding:0 10px}
}
</style>
</head>
<body>
<header>
  <div class="logo">回路<b>工房</b><small>CIRCUIT WORKSHOP · 電子工作インクリメンタル</small></div>
  <div class="counter">
    <div class="big"><span id="eNum">0</span><span class="u">e⁻</span></div>
    <div class="rate"><span id="eRate">0</span> e⁻/s</div>
  </div>
  <div class="power" id="power">
    <div class="lbl"><span>⚡ 消費電力</span><span id="pTxt">0 W / 2.5 W</span></div>
    <div class="bar"><div class="fill" id="pFill"></div></div>
    <div class="st" id="pSt">電源OK</div>
  </div>
</header>
<div class="ticker"><span class="tag">[NEWS]</span><span class="msg" id="news"></span><span class="buffs" id="buffs"></span></div>

<main>
  <section class="panel">
    <div class="ph">作業基板 <span class="hint">クリックではんだ付け → 電子を獲得</span></div>
    <div class="pb">
      <div id="boardWrap">
        <canvas id="board" tabindex="0" aria-label="基板。クリックで電子を獲得"></canvas>
        <div class="clickhint" id="clickHint">基板をクリックして<br>はんだ付けしよう</div>
      </div>
      <div class="clickinfo"><span>1クリック = <span id="cVal">1</span> e⁻</span><span>Space キーでもはんだ付け</span></div>
      <div class="statgrid">
        <div class="stat"><div class="k">今回の累計</div><div class="v" id="sRun">0</div></div>
        <div class="stat"><div class="k">生産倍率</div><div class="v" id="sMul">×1.00</div></div>
        <div class="stat"><div class="k">特許</div><div class="v" id="sPat">0</div></div>
        <div class="stat"><div class="k">実績</div><div class="v" id="sAch">0</div></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="ph">部品棚 <div class="amt" id="amt"><button data-a="1">×1</button><button data-a="10">×10</button><button data-a="100">×100</button><button data-a="max">MAX</button></div></div>
    <div class="pb" id="shop"></div>
  </section>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-t="up" class="on">強化<span class="dot" id="upDot" hidden></span></button>
      <button data-t="psu">電源<span class="dot" id="psuDot" hidden></span></button>
      <button data-t="ach">実績</button>
      <button data-t="pre">量産化</button>
      <button data-t="set">設定</button>
    </div>
    <div class="pb">
      <div class="tab on" id="t-up"><div id="upList"></div>
        <details id="upOwned"><summary class="sec" id="upOwnedH"></summary><div id="upOwnedList"></div></details></div>
      <div class="tab" id="t-psu">
        <div class="pp note" style="margin-bottom:10px">部品は電力を消費します。容量を超えると<b style="color:var(--bad)">電圧降下</b>で生産効率が落ちます（効率 = (容量/消費)²）。基本容量は USBバスパワー 5V/500mA = 2.5 W。</div>
        <div id="psuList"></div>
      </div>
      <div class="tab" id="t-ach"><div class="sec" id="achH"></div><div class="ach" id="achList"></div></div>
      <div class="tab" id="t-pre"><div id="preBox"></div></div>
      <div class="tab" id="t-set"><div id="setBox"></div></div>
    </div>
  </section>
</main>
<div id="toasts"></div>

<script>
'use strict';
/* =========================================================
   データ定義
   ========================================================= */
// デバッグモード: URL に ?debug を付けると有効。生産・クリックに倍率がかかり、セーブは通常とは別の場所に保存
const DEBUG = new URLSearchParams(location.search).has('debug');
let dbgMul = DEBUG ? 1000 : 1;
const SAVE_KEY = DEBUG ? 'kairo-koubou-debug' : 'kairo-koubou-save-v1';
const R_GEN = 1.15, R_PSU = 1.18, BASE_WATT = 2.5;
const SI = ['','k','M','G','T','P','E','Z','Y','R','Q'];

const GENS = [
  {id:'res',   ref:'R',  name:'炭素皮膜抵抗',   sub:'1/4W 10kΩ',       cost:15,    prod:0.1,   watt:0.05,  desc:'すべての回路はここから始まる。カラーコードは茶黒橙金。'},
  {id:'led',   ref:'D',  name:'赤色LED',        sub:'φ5mm 20mA',       cost:100,   prod:1,     watt:0.04,  desc:'光ると嬉しい。電流制限抵抗を忘れずに。'},
  {id:'cap',   ref:'C',  name:'電解コンデンサ', sub:'47µF 25V',        cost:1100,  prod:8,     watt:0.15,  desc:'極性に注意。逆に挿すとポンッ。'},
  {id:'tr',    ref:'Q',  name:'トランジスタ',   sub:'2SC1815',         cost:12000, prod:47,    watt:0.4,   desc:'増幅もスイッチもこなす万能選手。'},
  {id:'ic555', ref:'U1', name:'555タイマーIC',  sub:'NE555 DIP-8',     cost:1.3e5, prod:260,   watt:1.2,   desc:'半世紀現役のロングセラー。とりあえず発振。'},
  {id:'opamp', ref:'U2', name:'オペアンプ',     sub:'LM358 DIP-8',     cost:1.4e6, prod:1400,  watt:4,     desc:'理想は仮想短絡。現実はだいたい発振。'},
  {id:'mcu',   ref:'U3', name:'マイコン',       sub:'ATmega328P',      cost:2e7,   prod:7800,  watt:12,    desc:'ブートローダを焼いたら、もう何でも作れる。'},
  {id:'fpga',  ref:'U4', name:'FPGA',           sub:'50k LUT',         cost:3.3e8, prod:44000, watt:45,    desc:'ハードウェアをソフトのように書き換える。'},
  {id:'soc',   ref:'U5', name:'SoC',            sub:'64bit 8コア',     cost:5.1e9, prod:2.6e5, watt:160,   desc:'CPUもGPUもNPUも一枚のダイに。'},
  {id:'asic',  ref:'U6', name:'カスタムASIC',   sub:'3nm プロセス',    cost:7.5e10,prod:1.6e6, watt:600,   desc:'テープアウト一発勝負。マスク代は見ないこと。'},
  {id:'qpu',   ref:'QP', name:'量子チップ',     sub:'超伝導 1024qubit',cost:1e12,  prod:1e7,   watt:2500,  desc:'観測するまで、電子は増えているし増えていない。'},
  {id:'dc',    ref:'DC', name:'データセンター', sub:'ハイパースケール',cost:1.2e13,prod:7e7,   watt:12000, desc:'サーバー10万台。空調の音で会話が聞こえない。'},
  {id:'planet',ref:'PL', name:'惑星コンピュータ',sub:'全球回路網',      cost:1.4e14,prod:5.1e8, watt:55000, desc:'地表をまるごと基板に。大陸プレートが動くので配線は伸縮式。'},
  {id:'dyson', ref:'Σ',  name:'ダイソン球基板', sub:'恒星直結',        cost:1.6e15,prod:3.7e9, watt:2.5e5, desc:'太陽をまるごと電源に。はんだ付けは宇宙服で。'},
  {id:'mbrain',ref:'MB', name:'マトリョーシカ脳',sub:'入れ子ダイソン球',cost:1.8e16,prod:2.7e10,watt:1.1e6, desc:'恒星を何重にも包んだ計算機。排熱は外側の殻にお任せ。'},
  {id:'univ',  ref:'Ω',  name:'宇宙シミュレータ',sub:'全素粒子エミュ',  cost:2.1e17,prod:2e11,  watt:5e6,   desc:'この宇宙も、たぶん誰かの基板の上で動いている。'},
];
// 部品の並び順はセーブの配列・強化ID・実績IDに使われる。genIds を持たない旧セーブはこの並び（v1: 12種）として読む
const LEGACY_GEN_IDS = ['res','led','cap','tr','ic555','opamp','mcu','fpga','soc','asic','qpu','dyson'];

const PSUS = [
  {name:'単3乾電池',       sub:'1.5V アルカリ',   cost:50,    watt:1,     abbr:'AA'},
  {name:'9V電池',          sub:'006P',            cost:800,   watt:6,     abbr:'9V'},
  {name:'ACアダプタ',      sub:'12V 2A',          cost:1.5e4, watt:24,    abbr:'AC'},
  {name:'安定化電源',      sub:'30V 5A ラボ用',   cost:2.5e5, watt:150,   abbr:'LAB'},
  {name:'ATX電源',         sub:'850W 80PLUS Gold',cost:6e6,   watt:850,   abbr:'ATX'},
  {name:'産業用電源ラック',sub:'三相200V',        cost:2e8,   watt:8000,  abbr:'3φ'},
  {name:'メガソーラー',    sub:'1 MW',            cost:1e10,  watt:1e6,   abbr:'PV'},
  {name:'核融合炉',        sub:'トカマク型',      cost:5e12,  watt:1e9,   abbr:'FUS'},
];

const TIER_TH = [10, 25, 50, 100, 200];
const TIER_CM = [10, 50, 500, 5e4, 5e6];
const TIER_NAMES = {
  res:  ['金属皮膜抵抗','精密1%品','チップ抵抗 0603','薄膜抵抗アレイ','超精密0.01%品'],
  led:  ['高輝度LED','フルカラーLED','シリアルLED','LEDマトリクス','マイクロLED'],

/* =========================================================
   数値表示
   ========================================================= */
function fmtRaw(n) {
  const e3 = Math.floor(Math.log10(n)/3);
  return n < 1000 ? String(n) : (n/Math.pow(10,e3*3)) + SI[e3];
}
function fmt(n, small) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n, small);
  if (n < 1000) {
    if (small && n !== Math.floor(n) && n < 100) return n < 10 ? String(+n.toFixed(2)) : n.toFixed(1);
    return String(Math.floor(n));
  }
  let e3 = Math.floor(Math.log10(n)/3);
  // 丸めた後の値で桁数を決める（99.996k → 100.00k ではなく 100.0k、999.95M → 1000.0M ではなく 1.00G）
  const f = x => { const s = x.toFixed(2); return +s >= 100 ? x.toFixed(1) : s; };
  let s = f(n / Math.pow(10, e3*3));
  if (+s >= 1000) { e3++; s = f(n / Math.pow(10, e3*3)); }
  if (S.notation === 'sci' || e3 >= SI.length) return n.toExponential(2).replace('e+','e');
  return s + SI[e3];
}
function fmtW(w) {
  if (w === 0) return '0 W';
  if (w < 1) return (w*1000 < 10 ? (w*1000).toFixed(1) : Math.round(w*1000)) + ' mW';
  const s = fmt(w, true);
  return S.notation === 'sci' || /e/.test(s) ? s + ' W' : s.replace(/([a-zA-Z])$/, ' $1') .replace(/^([\d.]+)$/, '$1 ') + 'W';
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}時間${m}分` : m ? `${m}分${s}秒` : `${s}秒`;
}

/* =========================================================
   計算
   ========================================================= */
function derive() {
  const gm = GENS.map(()=>1), wm = GENS.map(()=>1);
  let click = 1, pct = 0, glob = 1, psuM = 1;
  for (const u of UPS) if (S.ups[u.id]) {
    if (u.type === 'gen') gm[u.gen] *= u.mult;
    else if (u.type === 'watt') wm[u.gen] *= u.mult;
    else if (u.type === 'click') click *= u.mult;
    else if (u.type === 'pct') pct += u.pct;
    else if (u.type === 'global') glob *= u.mult;
    else if (u.type === 'psu') psuM *= u.mult;
  }
  const achN = Object.keys(S.ach).length;
  glob *= (1 + 0.01*achN) * (1 + 0.05*S.patents) * dbgMul;
  const now = Date.now();
  let bp = 1, bc = 1;
  for (const b of S.buffs) if (b.until > now) { if (b.type === 'prod') bp *= b.mult; else bc *= b.mult; }
  let raw = 0, draw = 0;
  const per = GENS.map((g,i) => {
    const p = g.prod * cnt(i) * gm[i] * glob * bp;
    raw += p; draw += g.watt * cnt(i) * wm[i];
    return p;
  });
  let cap = BASE_WATT;
  PSUS.forEach((p,i) => cap += p.watt * (S.psus[i]||0));
  cap *= psuM;
  const eff = draw <= cap ? 1 : Math.pow(cap/draw, 2);
  const eps = raw * eff;
  const unitClick = click * (1 + 0.05*S.patents) * dbgMul;
  D = {gm, wm, per, raw, draw, cap, eff, eps, glob, bp, bc, psuM, pct, unitClick,
       clickVal: (unitClick + eps*pct) * bc};
}

function bulkCost(base, r, have, n) { return base * Math.pow(r, have) * (Math.pow(r, n) - 1) / (r - 1); }
function maxAfford(base, r, have, bank) {
  const n = Math.floor(Math.log(bank*(r-1) / (base*Math.pow(r, have)) + 1) / Math.log(r));
  return Math.max(0, n);
}
function buyCount(base, r, have) {
  if (S.buyAmt === 'max') return Math.max(1, maxAfford(base, r, have, S.e));
  return +S.buyAmt;
}

function gain(v) { S.e += v; S.earnedRun += v; S.earnedAll += v; }

function buyGen(i) {
  if (!revealed(i)) return;
  const g = GENS[i], n = buyCount(g.cost, R_GEN, cnt(i)), c = bulkCost(g.cost, R_GEN, cnt(i), n);
  if (S.e < c) return;
  S.e -= c; S.gens[i] += n;
  derive(); boardDirty = true; updateUI();
}
function buyPsu(i) {
  const p = PSUS[i], have = S.psus[i]||0, n = buyCount(p.cost, R_PSU, have), c = bulkCost(p.cost, R_PSU, have, n);
  if (S.e < c) return;
  S.e -= c; S.psus[i] = have + n;
  derive(); updateUI();
}
function buyUp(id) {
  const u = UPS.find(x => x.id === id);
  if (!u) return;
  if (S.ups[id]) { toast(`「${u.name}」は購入済みです`, '', '一覧を更新しました'); upKey = null; updateUI(); return; }
  if (S.e < u.cost) { toast(`「${u.name}」には e⁻ が足りません`, '', `あと ${fmt(u.cost - S.e)} e⁻`); return; }
  S.e -= u.cost; S.ups[id] = 1;
  derive(); boardDirty = true; upKey = null; updateUI();
  toast(`「${u.name}」を購入しました`, 'gold', `${u.desc}（-${fmt(u.cost)} e⁻）`);
}
function revealed(i) { return i === 0 || cnt(i) > 0 || cnt(i-1) > 0 || S.earnedAll >= GENS[i].cost; }

/* =========================================================
   基板（canvas）
   ========================================================= */
const cv = $('#board'), cx = cv.getContext('2d');
const wrap = $('#boardWrap');
const stat = document.createElement('canvas'), sx = stat.getContext('2d');
const COLS = 12;
let cell = 32, BW = 480, BH = 448, dpr = 1, boardDirty = true, boardKey = '';
const sparks = [];

function layoutBoard() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  BW = wrap.clientWidth || 480;
  cell = BW / (COLS + 3);
  BH = cell * (GENS.length + 2);
  cv.style.height = BH + 'px';
  cv.width = stat.width = Math.round(BW*dpr);
  cv.height = stat.height = Math.round(BH*dpr);
  boardDirty = true;
}
const rowY = i => cell * (1.5 + i);
const slotX = j => cell * (3 + j);
const busX = () => cell * 2.15;

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x,y,w,h,r) : c.rect(x,y,w,h); }
function seeded(seed) { return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

function drawStatic() {
  const c = sx;
  c.setTransform(dpr,0,0,dpr,0,0);
  // PCB
  const gr = c.createLinearGradient(0,0,BW,BH);
  gr.addColorStop(0,'#11573a'); gr.addColorStop(1,'#0b3f27');
  c.fillStyle = gr; c.fillRect(0,0,BW,BH);
  // ビア
  const rnd = seeded(42);
  c.fillStyle = 'rgba(0,0,0,.18)';
  for (let k = 0; k < 90; k++) { c.beginPath(); c.arc(rnd()*BW, rnd()*BH, cell*0.05, 0, 7); c.fill(); }
  // 取付穴
  for (const [x,y] of [[cell*.45,cell*.45],[BW-cell*.45,cell*.45],[cell*.45,BH-cell*.45],[BW-cell*.45,BH-cell*.45]]) {
    c.fillStyle = '#c9a54a'; c.beginPath(); c.arc(x,y,cell*.28,0,7); c.fill();
    c.fillStyle = '#0b110d'; c.beginPath(); c.arc(x,y,cell*.16,0,7); c.fill();
  }
  // 電源レール
  const top = cell*0.6, bot = BH - cell*0.6;
  c.lineWidth = cell*0.14; c.lineCap = 'round';
  c.strokeStyle = '#c4643a'; c.beginPath(); c.moveTo(cell*1.1, top); c.lineTo(BW-cell*1.1, top); c.stroke();
  c.strokeStyle = '#7a8a94'; c.beginPath(); c.moveTo(cell*1.1, bot); c.lineTo(BW-cell*1.1, bot); c.stroke();
  c.font = `${cell*0.36}px 'Share Tech Mono', monospace`; c.fillStyle = '#eef3ee'; c.textBaseline = 'middle';
  c.fillText('+5V', BW - cell*1.0 - c.measureText('+5V').width - cell*0.4, top - cell*0.3);
  c.fillText('GND', BW - cell*1.0 - c.measureText('GND').width - cell*0.4, bot + cell*0.3 > BH ? bot - cell*0.3 : bot - cell*0.3);
  // 縦バス
  c.strokeStyle = '#d8b04a'; c.lineWidth = cell*0.1;
  c.beginPath(); c.moveTo(busX(), top); c.lineTo(busX(), bot); c.stroke();
  // 行
  GENS.forEach((g,i) => {
    const y = rowY(i), rev = revealed(i), n = cnt(i);
    c.globalAlpha = rev ? 1 : 0.28;
    if (n > 0) {
      c.strokeStyle = '#d8b04a'; c.lineWidth = cell*0.07;
      c.beginPath(); c.moveTo(busX(), y); c.lineTo(slotX(COLS-1)+cell*0.45, y); c.stroke();
      c.fillStyle = '#d8b04a'; c.beginPath(); c.arc(busX(), y, cell*0.09, 0, 7); c.fill();
    }
    c.fillStyle = '#eef3ee';
    c.font = `${cell*0.42}px 'Share Tech Mono', monospace`;
    c.fillText(rev ? g.ref : '?', cell*0.55, y - (n > 0 ? cell*0.12 : 0));
    if (n > 0) { c.font = `${cell*0.3}px 'Share Tech Mono', monospace`; c.fillStyle = '#d8b04a'; c.fillText('×'+fmt(n), cell*0.55, y + cell*0.24); }
    const vis = Math.min(n, COLS);
    for (let j = 0; j < COLS; j++) {
      const x = slotX(j);
      if (j < vis) drawComp(c, g.id, x, y, cell*0.92, D.eff > 0.45);
      else {
        c.strokeStyle = 'rgba(238,243,238,.22)'; c.lineWidth = 1;
        c.strokeRect(x - cell*0.38, y - cell*0.2, cell*0.76, cell*0.4);
        c.fillStyle = '#c47a3a';
        for (const dx of [-0.24, 0.24]) {
          c.beginPath(); c.arc(x + dx*cell, y, cell*0.08, 0, 7); c.fill();
          c.fillStyle = '#0b110d'; c.beginPath(); c.arc(x + dx*cell, y, cell*0.03, 0, 7); c.fill(); c.fillStyle = '#c47a3a';
        }
      }
    }
    c.globalAlpha = 1;
  });
  // シルク
  c.fillStyle = 'rgba(238,243,238,.55)';
  c.font = `${cell*0.3}px 'Share Tech Mono', monospace`;
  c.fillText('KAIRO-KOUBOU  REV.' + String.fromCharCode(65 + Math.min(S.prestiges, 25)), cell*1.1, BH - cell*0.25);
}

      c.strokeStyle = '#5c646d'; c.lineWidth = Math.max(1, s*0.03); c.strokeRect(-u*.55, -u*.85, u*1.1, u*1.7);

function drawIcon(canvas, id) {
  const c = canvas.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#0f4d30'; c.fillRect(0, 0, canvas.width, canvas.height);
  drawComp(c, id, canvas.width/2, canvas.height/2, canvas.width*0.78, true);
}

function sparkAt(x, y) {
  if (!S.fx) return;
  for (let k = 0; k < 10; k++) {
    const a = Math.random()*Math.PI*2, v = 60 + Math.random()*160;
    sparks.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60, life:0.35 + Math.random()*0.3, t:0});
  }
  sparks.push({x, y, blob:true, life:0.5, t:0});
  if (sparks.length > 300) sparks.splice(0, sparks.length - 300);
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame)/1000); lastFrame = now;
  const key = S.gens.join(',') + '|' + GENS.map((_,i) => revealed(i) ? 1 : 0).join('') + '|' + (D.eff > 0.45) + '|' + S.notation + '|' + S.prestiges;
  if (boardDirty || key !== boardKey) { drawStatic(); boardKey = key; boardDirty = false; }
  const c = cx;
  c.setTransform(1,0,0,1,0,0);
  c.drawImage(stat, 0, 0);
  c.setTransform(dpr,0,0,dpr,0,0);
  const t = now/1000;
  const brown = D.eff < 1;
  // 電流の流れ
  if (S.fx) {
    c.save();
    c.shadowBlur = 6;
    const col = brown ? '#ff7a59' : '#fff1a8';
    c.shadowColor = col; c.fillStyle = col;
    if (brown) c.globalAlpha = 0.55 + 0.45*Math.abs(Math.sin(t*13));
    const top = cell*0.6, bot = BH - cell*0.6;
    if (D.eps > 0) {
      const sp = 0.15 + 0.05*Math.log10(1 + D.eps);
      for (let k = 0; k < 6; k++) { const p = (t*sp + k/6) % 1; c.beginPath(); c.arc(busX(), top + (bot-top)*p, cell*0.07, 0, 7); c.fill(); }
    }
    GENS.forEach((g,i) => {
      if (!cnt(i)) return;
      const y = rowY(i), x0 = busX(), x1 = slotX(COLS-1) + cell*0.45;
      const sp = Math.min(1.2, 0.08 + 0.06*Math.log10(1 + D.per[i]*D.eff));
      const nd = 3 + Math.min(4, Math.floor(Math.log10(1 + cnt(i))*2));
      for (let k = 0; k < nd; k++) { const p = (t*sp + k/nd + i*0.13) % 1; c.beginPath(); c.arc(x0 + (x1-x0)*p, y + cell*0.32, cell*0.045, 0, 7); c.fill(); }
    });
    c.restore();
  }
  // 火花
  for (let k = sparks.length - 1; k >= 0; k--) {
    const p = sparks[k]; p.t += dt;
    if (p.t >= p.life) { sparks.splice(k, 1); continue; }
    const a = 1 - p.t/p.life;
    if (p.blob) {
      c.fillStyle = `rgba(220,226,232,${a*0.9})`;
      c.beginPath(); c.arc(p.x, p.y, cell*0.18*(1 + p.t), 0, 7); c.fill();
      c.strokeStyle = `rgba(255,255,255,${a*0.5})`; c.lineWidth = 2;
      c.beginPath(); c.arc(p.x, p.y, cell*0.3 + p.t*cell*2, 0, 7); c.stroke();
    } else {
      p.vy += 420*dt; const nx = p.x + p.vx*dt, ny = p.y + p.vy*dt;
      c.strokeStyle = `rgba(255,${180 + 60*a|0},80,${a})`; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(nx, ny); c.stroke();
      p.x = nx; p.y = ny;
    }
  }
  requestAnimationFrame(frame);
}

// シャッフルバッグ: 全ニュースを一巡するまで同じものは出さない。位置はセーブに残すのでリロードしても重複しない。
// さらに同じキーワード（話題）を含むニュースは直近 NEWS_GAP 本の中に並べない（似た話が続くと「また同じ」に見えるため）
const NEWS_VER = 2;
const NEWS_GAP = 15;
const NEWS_TOPICS = ['Lチカ','データシート','ディスコン','パスコン','プル','I²C','静電気','オシロ','ブレッドボード','接触不良',
  '送料','足りない','余','発注','膨らん','量子','FPGA','直せます','動かない','秋葉原','LED','GND','はんだ','ジャンク','眠',
  'コンデンサ','抵抗','マイコン','電源','ケース','発振','リセット','雑誌','引き出し','ルーペ','老眼','テスター','基板'];
const newsTopics = NEWS.map(t => NEWS_TOPICS.filter(k => t.includes(k)));
function shuffledNews(prev) {
  const pool = NEWS.map((_,i) => i);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const out = [], recent = prev.slice(-NEWS_GAP);
  while (pool.length) {
    const used = new Set(recent.flatMap(i => newsTopics[i]));
    let best = 0, bestScore = Infinity;
    for (let k = 0; k < pool.length; k++) {
      const sc = newsTopics[pool[k]].filter(t => used.has(t)).length + (recent.includes(pool[k]) ? 100 : 0);
      if (sc < bestScore) { best = k; bestScore = sc; if (sc === 0) break; }
    }
    const pick = pool.splice(best, 1)[0];
    out.push(pick); recent.push(pick);
    if (recent.length > NEWS_GAP) recent.shift();
  }
  return out;
}
function nextNews() {
  const bag = S.newsBag;
  if (S.newsV !== NEWS_VER || !Array.isArray(bag) || bag.length !== NEWS.length || !(S.newsPos >= 0)) {
    S.newsBag = shuffledNews([]); S.newsPos = 0; S.newsV = NEWS_VER;
  } else if (S.newsPos >= bag.length) { S.newsBag = shuffledNews(bag); S.newsPos = 0; }
  const idx = S.newsBag[S.newsPos++];
  const m = $('#news');
  m.style.opacity = 0;
  setTimeout(() => { m.textContent = NEWS[idx]; m.style.opacity = 1; }, 400);
}

/* =========================================================
   セーブ／ロード
   ========================================================= */
function save() {
  S.last = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load(o) {
  const d = defaults();
  S = Object.assign(d, o);
  // セーブ時の部品の並び（genIds）から今の並びへ、個数・強化ID（g0_1, w0）・実績ID（o0_50）を付け替える
  const ids = Array.isArray(o.genIds) ? o.genIds : LEGACY_GEN_IDS;
  const remap = i => GENS.findIndex(g => g.id === ids[i]);
  const rekey = obj => {
    const r = {};
    for (const k in obj || {}) {
      const m = k.match(/^([gwo])(\d+)(_\d+)?$/);
      if (!m) { r[k] = obj[k]; continue; }
      const j = remap(+m[2]);
      if (j >= 0) r[m[1] + j + (m[3] || '')] = obj[k];
    }
    return r;
  };
  S.gens = GENS.map(() => 0);
  (Array.isArray(o.gens) ? o.gens : []).forEach((n, i) => { const j = remap(i); if (j >= 0) S.gens[j] = +n || 0; });
  S.genIds = GENS.map(g => g.id);
  S.psus = PSUS.map((_,i) => +(o.psus && o.psus[i]) || 0);
  S.ups = rekey(o.ups); S.ach = rekey(o.ach); S.buffs = Array.isArray(o.buffs) ? o.buffs : [];
  upKey = null; boardDirty = true;
  derive();
}
function boot() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (raw) {
    try {
      load(JSON.parse(raw));
      const away = Math.min(86400, (Date.now() - S.last)/1000);
      if (away > 30) {
        S.buffs = [];
        derive();
        const v = D.eps * away * 0.5;
        if (v > 0) { gain(v); setTimeout(() => toast(`おかえりなさい（${fmtTime(away)}ぶり）`, 'gold', `留守中に ${fmt(v)} e⁻ を生産しました`), 300); }
      }
    } catch (e) { S = defaults(); }
  }
  if (S.clicksAll >= 5) $('#clickHint').style.display = 'none';
  if (DEBUG) { document.title = '[DEBUG] ' + document.title; $('.logo small').textContent = 'DEBUG MODE · ?debug'; $('.logo small').style.color = 'var(--warn)'; nextJunk = Date.now() + junkGap(); }
  buildShop();
  layoutBoard();
  derive();
  showTab(S.tab || 'up');
  nextNews();
  new ResizeObserver(layoutBoard).observe(wrap);
  if (document.fonts) document.fonts.ready.then(() => { boardDirty = true; });
  requestAnimationFrame(frame);

  let lastT = Date.now();
  setInterval(() => {
    const now = Date.now(), dt = Math.min(3600, (now - lastT)/1000); lastT = now;
    S.buffs = S.buffs.filter(b => b.until > now);
    derive();
    gain(D.eps * dt);
    if (D.draw > 0 && D.eff < 0.5) S.smoked = true;
    if (D.eps > S.maxEps) S.maxEps = D.eps;
    junkTick(now);
    updateUI();
  }, 100);
  setInterval(checkAch, 1000);
  setInterval(save, 15000);
  setInterval(nextNews, 9000);
  addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
boot();
</script>
